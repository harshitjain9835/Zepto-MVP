<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Zepto | Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  * { font-family: 'Plus Jakarta Sans', sans-serif; }
  body {
    background-color: #f8f8f8;
    color: #1a1a1a;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
  }
</style>
</head>
<body>

<!-- ── STICKY HEADER ─────────────────────────────────────────────────────── -->
<header class="sticky top-0 z-50 bg-white shadow-sm">
  <div class="flex items-center gap-3 px-3 py-3">
    
    <!-- Logo -->
    <span class="text-[22px] font-extrabold text-[#8B2CF5]">zepto</span>
    
    <!-- Delivery Time & Location -->
    <div class="flex items-center gap-1 text-[12px]">
      <span class="material-symbols-outlined text-[13px] text-[#8B2CF5]" style="font-variation-settings:'FILL' 1;">bolt</span>
      <span class="font-bold text-gray-800">6 minutes</span>
      <span class="text-gray-400">|</span>
      <button class="flex items-center gap-0.5 text-gray-600">
        <span class="text-[11px] font-medium">Ward 44 – Ward 44, Kolkata, West B...</span>
        <span class="material-symbols-outlined text-[13px]">expand_more</span>
      </button>
    </div>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Profile -->
    <button class="flex flex-col items-center gap-0.5">
      <span class="material-symbols-outlined text-[22px] text-gray-600">account_circle</span>
      <span class="text-[9px] text-gray-500 font-medium">Profile</span>
    </button>

    <!-- Cart -->
    <button class="flex flex-col items-center gap-0.5 relative" data-nav="cart">
      <span class="material-symbols-outlined text-[22px] text-gray-600">shopping_cart</span>
      <span class="text-[9px] text-gray-500 font-medium">Cart</span>
      <span class="absolute -top-0.5 -right-0.5 bg-[#8B2CF5] text-white text-[8px] font-bold w-4 h-4 rounded-full flex items-center justify-center">2</span>
    </button>

  </div>

  <!-- Search Bar -->
  <div class="px-3 pb-3">
    <div class="relative">
      <span class="material-symbols-outlined text-gray-400 text-[18px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">search</span>
      <input
        class="w-full h-10 bg-gray-100 rounded-full pl-9 pr-3 text-sm placeholder:text-gray-400 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#8B2CF5]"
        placeholder='Search for over 5000 products'
        type="text"
        autofocus
      />
    </div>
  </div>
</header>

<!-- ── MAIN ───────────────────────────────────────────────────────────────── -->
<main class="pb-24 px-3 pt-3">

  <!-- Paan Corner Banner -->
  <section class="rounded-3xl p-6 mb-4 relative overflow-hidden" style="background:#A3D9E8;">
    
    <!-- Left Content -->
    <div class="relative z-10 w-2/3">
      <h2 class="text-[20px] font-black text-teal-900 leading-tight">
        GET CIGARETTES AT <span class="inline-block bg-gray-800 text-white px-2 py-1 rounded-lg mx-1 text-[18px]">₹0</span><br/>CONVENIENCE FEE
      </h2>
      <p class="text-[13px] font-semibold text-teal-800 mt-2 leading-snug">
        Get smoking accessories, fresheners &amp; more delivered in minutes!
      </p>
      <button class="mt-4 bg-gray-800 text-white text-[12px] font-bold px-4 py-2 rounded-full flex items-center gap-1 active:opacity-80">
        Order now <span class="material-symbols-outlined text-[14px]">chevron_right</span>
      </button>
    </div>

    <!-- Right Product Image -->
    <div class="absolute right-4 bottom-0 w-32 h-32">
      <img class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8CgEf5oo1W0N_-ndHyVEvP-qI65dJUY67GhUcexN5wqweOXS2aWhawaZxhX7kN737Tq2cBYh5Nbwgmim2bJsoOILIlC3p1zdfETCEzhkBwnvFoqtP0u5VOouK3-rabaechc02qtT4lV_9vrW_hLrh9htVPYw2Fhvl836R6jq9gQoJ-nFBbzRs3XygElVDrR4QHYKIczEJH9P3rGf4lmN2EMjXVqSaG-3Ybu0v7IoE9VU2F7sba_fEfutaj57XsXkXkUrODpE0EhdJ" alt="Cigarettes Paan"/>
    </div>

  </section>

  <!-- Offers Section -->
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-[14px] font-bold text-gray-800">Offers</h3>
    <button class="text-[12px] font-semibold text-[#8B2CF5] flex items-center gap-1">
      <span>Collapse</span>
      <span class="material-symbols-outlined text-[14px]">expand_less</span>
    </button>
  </div>

  <!-- Unlock Free Delivery Card -->
  <div class="bg-gray-800 rounded-2xl px-4 py-3 flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-[18px] text-gray-800" style="font-variation-settings:'FILL' 1;">local_shipping</span>
      </div>
      <div>
        <p class="text-[12px] font-bold text-white">Unlock free delivery</p>
        <p class="text-[11px] text-gray-300">Shop for ₹149</p>
      </div>
    </div>
    <span class="material-symbols-outlined text-[20px] text-gray-400">chevron_right</span>
  </div>

  <!-- Popular Searches / Trending -->
  <section>
    <h3 class="text-[14px] font-bold text-gray-800 mb-3">Trending Searches</h3>
    <div class="grid grid-cols-2 gap-2">
      
      <button class="bg-white rounded-xl p-3 text-left border border-gray-100 shadow-sm active:opacity-80">
        <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Trending</p>
        <p class="text-[13px] font-bold text-gray-800 mt-1">Milk</p>
      </button>

      <button class="bg-white rounded-xl p-3 text-left border border-gray-100 shadow-sm active:opacity-80">
        <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Trending</p>
        <p class="text-[13px] font-bold text-gray-800 mt-1">Doritos</p>
      </button>

      <button class="bg-white rounded-xl p-3 text-left border border-gray-100 shadow-sm active:opacity-80">
        <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Trending</p>
        <p class="text-[13px] font-bold text-gray-800 mt-1">Bread</p>
      </button>

      <button class="bg-white rounded-xl p-3 text-left border border-gray-100 shadow-sm active:opacity-80">
        <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Trending</p>
        <p class="text-[13px] font-bold text-gray-800 mt-1">Tea & Coffee</p>
      </button>

      <button class="bg-white rounded-xl p-3 text-left border border-gray-100 shadow-sm active:opacity-80">
        <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Trending</p>
        <p class="text-[13px] font-bold text-gray-800 mt-1">Biscuits</p>
      </button>

      <button class="bg-white rounded-xl p-3 text-left border border-gray-100 shadow-sm active:opacity-80">
        <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Trending</p>
        <p class="text-[13px] font-bold text-gray-800 mt-1">Chips</p>
      </button>

    </div>
  </section>

</main>

<!-- ── BOTTOM NAV ─────────────────────────────────────────────────────────── -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-white border-t border-gray-100 flex justify-around items-center px-4 py-2 pb-safe shadow-[0_-2px_12px_rgba(0,0,0,0.06)]">
  <a class="flex flex-col items-center gap-0.5" href="#" data-nav="home">
    <span class="material-symbols-outlined text-[24px] text-gray-400">bolt</span>
    <span class="text-[10px] font-medium text-gray-400">Zepto</span>
  </a>
  <a class="flex flex-col items-center gap-0.5" href="#">
    <span class="material-symbols-outlined text-[24px] text-gray-400">grid_view</span>
    <span class="text-[10px] font-medium text-gray-400">Categories</span>
  </a>
  <a class="flex flex-col items-center gap-0.5" href="#">
    <span class="material-symbols-outlined text-[24px] text-[#8B2CF5]" style="font-variation-settings:'FILL' 1;">search</span>
    <span class="text-[10px] font-bold text-[#8B2CF5]">Search</span>
  </a>
  <a class="flex flex-col items-center gap-0.5" href="#">
    <span class="material-symbols-outlined text-[24px] text-gray-400">auto_awesome</span>
    <span class="text-[10px] font-medium text-gray-400">Curated</span>
  </a>
</nav>

<script src="../app-router.js"></script>
</body>
</html>
